<style>
:root{--red:#C8322F;--dark:#8f1f1d;--ink:#1c1c1c;--bg:#faf8f8;--line:#e6dede}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
header{background:#fff;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
header img{height:46px}header b{font-size:20px;font-weight:800;flex:1;color:var(--red);min-width:120px}header nav{display:flex;gap:6px;flex-wrap:wrap}header{flex-wrap:wrap}@media(max-width:560px){header img{height:36px}header b{font-size:16px}}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 18px;background:var(--red);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}.sm{padding:6px 12px;font-size:14px}.gray{background:#555}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{background:var(--red);color:#fff;border-radius:14px;padding:36px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero img{height:110px;background:#fff;border-radius:50%;padding:12px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0 0 16px;opacity:.95;max-width:520px}
.hero .btn{background:#fff;color:var(--red);margin-inline-end:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border-inline-start:4px solid var(--red);padding:6px 12px}.stat small{color:#777;display:block}.stat b{font-size:20px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:8px}input:focus{outline:2px solid var(--red)}
.form{max-width:420px;margin:30px auto}.err{color:var(--red);margin-top:10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:start;border-bottom:1px solid var(--line)}th{background:#f5eded}
.tw{overflow-x:auto}.note{background:#fff3f3;border:1px dashed var(--red);border-radius:8px;padding:12px;margin-top:16px;font-size:14px}
#alarm{position:sticky;top:67px;z-index:4;background:var(--red);color:#fff;padding:16px;border-radius:12px;margin-bottom:16px;animation:p 1s infinite alternate;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--red)}
#alarm h2{margin:0 0 6px}#alarm .amt{font-size:28px;font-weight:800}#alarm button,#alarm .btn{background:#fff;color:var(--red);margin:8px 6px 0 0}
@keyframes p{to{background:var(--dark)}}@media(prefers-reduced-motion:reduce){#alarm{animation:none}}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.modal>div{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:520px}
.tabs{display:flex;gap:8px;margin-bottom:8px}.hide{display:none}
.hero{position:relative;overflow:hidden}.hero img{height:84px}.hero .btn{margin:4px}.sky{flex:1;min-width:240px;align-self:flex-end;margin-bottom:-36px}
.sec{margin:34px 0 4px;color:var(--red)}.subt{margin:0 0 6px;color:#666}.feats{margin-top:6px}.feat{margin:0}.feat h3{margin:10px 0 4px}.feat p{margin:0;color:#555;font-size:15px}
.ico{width:52px;height:52px;border-radius:12px;background:#fdeeee;display:grid;place-items:center}
.how{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.steps{flex:2;min-width:260px}.tower{flex:1;min-width:150px;max-width:220px;margin:16px auto 0}
.step{display:flex;gap:14px;align-items:flex-start}.step span{background:var(--red);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}.step h3{margin:0 0 4px}.step p{margin:0;color:#555}

${P.reports?`<div class="card"><h2 style="margin-top:0">${t("sum")}</h2><div class="grid"><div class="stat"><small>${t("tn")}</small><b>${ts.length}</b></div><div class="stat"><small>${t("ndue")}</small><b>${due.length}</b></div><div class="stat"><small>${t("tpd")}</small><b>${money(sum("paid"))}</b></div><div class="stat"><small>${t("trm")}</small><b>${money(sum("remaining"))}</b></div></div></div>`:""}
${P.view?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${t("tn")}</h3>${P.manager?`<button id="ad">${t("add")}</button>`:""}</div><div class="tw" style="margin-top:10px"><table><tr><th>${t("fn")}</th><th>${t("prop")}</th><th>${t("paid")}</th><th>${t("rem")}</th><th></th></tr>
${ts.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.property)}</td><td>${money(x.paid)}</td><td style="color:${x.remaining>0?"#C8322F":"inherit"};font-weight:600">${money(x.remaining)}</td><td>${P.edit?`<button class="sm" data-e="${x.id}">${t("edit")}</button> `:""}${P.manager?`<button class="sm gray" data-d="${x.id}">${t("del")}</button>`:""}</td></tr>`).join("")}</table></div></div>`:""}
${P.manager&&sb.staff?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${t("staff")}</h3><button id="sa">${t("sadd")}</button></div>${st.length?`<div class="tw" style="margin-top:10px"><table>${st.map(u=>`<tr><td><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></td><td>${pl(u)}</td><td><button class="sm gray" data-s="${u.id}">${t("del")}</button></td></tr>`).join("")}</table></div>`:`<p>${t("nostaff")}</p>`}</div>`:""}
${P.manager?`<div class="card"><h3 style="margin-top:0">${t("set")}</h3><label>${t("ph")}</label><input id="sp" value="${esc(S.phone)}"><label>${t("wal")}</label><input id="sw" value="${esc(S.whatsapp)}">
<label>${t("hero")} (AR)</label><input id="s1" value="${esc(S.hero_ar||"")}"><label>${t("hero")} (EN)</label><input id="s2" value="${esc(S.hero_en||"")}">
<label>${t("hsub")} (AR)</label><input id="s3" value="${esc(S.sub_ar||"")}"><label>${t("hsub")} (EN)</label><input id="s4" value="${esc(S.sub_en||"")}">
<p><button id="ss">${t("save")}</button></p></div>`:""}<p><button class="gray sm" id="out">${t("logout")}</button></p>`);
const on=(i,f)=>{const e=$(i);if(e)e.onclick=f};
on("#out",async()=>{await sb.auth.signOut();go("#/")});on("#ad",()=>editor({}));on("#sa",()=>staffEditor());
document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editor(ts.find(x=>x.id==b.dataset.e)));
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(await ask(t("sure"))){await sb.from("tenants").delete().eq("id",b.dataset.d);dash()}});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{if(await ask(t("sure"))){sb.staff.remove(b.dataset.s);dash()}});
on("#ss",async()=>{const m={phone:"sp",whatsapp:"sw",hero_ar:"s1",hero_en:"s2",sub_ar:"s3",sub_en:"s4"};
await sb.from("settings").upsert(Object.entries(m).map(([key,i])=>({key,value:$("#"+i).value})));await loadSettings();say(t("ok"))})}
function staffEditor(){const m=document.createElement("div");m.className="modal";
m.innerHTML=`<div><h3 style="margin-top:0">${t("sadd")}</h3><label>${t("sname")}</label><input id="un"><label>${t("em")}</label><input id="ue" type="email"><label>${t("pw")}</label><input id="up" type="password" autocomplete="new-password">
<label>${t("sperm")}</label>${[["view","pv"],["edit","pe"],["reports","pr"]].map(([k,l])=>`<label style="font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" data-p="${k}" style="width:auto"> ${t(l)}</label>`).join("")}
<p><button id="sv">${t("save")}</button> <button class="ghost" id="cl">${t("cancel")}</button></p></div>`;
document.body.appendChild(m);$("#cl").onclick=()=>m.remove();
$("#sv").onclick=()=>{const perms={};m.querySelectorAll("[data-p]").forEach(c=>perms[c.dataset.p]=c.checked);
const r=sb.staff.add({name:$("#un").value.trim(),email:$("#ue").value.trim(),password:$("#up").value,perms});if(r)say(t("s"+r));else{m.remove();dash()}}}
async function editor(x){let pays=[];if(x.id){const r=await sb.from("payments").select("*").eq("tenant_id",x.id).order("paid_on",{ascending:false});pays=r.data||[]}
const m=document.createElement("div");m.className="modal";
m.innerHTML=`<div><h3 style="margin-top:0">${t(x.id?"edit":"add")}</h3>${F.map(([k,l])=>`<label>${t(l)}</label><input data-k="${k}"${["birth_date","contract_period"].includes(k)?' type="date"':""} value="${esc(x[k]??"")}">`).join("")}
<p><button id="sv">${t("save")}</button> <button class="ghost" id="cl">${t("cancel")}</button></p>
${x.id?`<hr><h4>${t("hist")}</h4>${pays.map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0">${esc(r.paid_on)} — ${money(r.amount)} ${esc(r.note)}<button class="sm gray" data-p="${r.id}">${t("del")}</button></div>`).join("")}
<label>${t("amt")}</label><input id="pa" type="number"><label>${t("date")}</label><input id="pd" type="date"><label>${t("note")}</label><input id="pn"><p><button id="pp">${t("addp")}</button></p>`:""}</div>`;
document.body.appendChild(m);const done=()=>{m.remove();dash()};$("#cl").onclick=()=>{m.remove()};
$("#sv").onclick=async()=>{const o={};m.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=["rent","paid","remaining"].includes(i.dataset.k)?Number(i.value||0):i.value.trim());
const r=x.id?await sb.from("tenants").update(o).eq("id",x.id):await sb.from("tenants").insert(o);if(r.error)say(r.error.message);else done()};
m.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{await sb.from("payments").delete().eq("id",b.dataset.p);m.remove();editor(x)});
if(x.id)$("#pp").onclick=async()=>{const r=await sb.from("payments").insert({tenant_id:x.id,amount:Number($("#pa").value),paid_on:$("#pd").value||new Date().toISOString().slice(0,10),note:$("#pn").value});if(r.error)say(r.error.message);else{m.remove();editor(x)}}}
async function route(){chrome();if(page!="account")stopAlarm();const m={tenant:()=>loginForm("tenant"),account,admin:()=>loginForm("admin"),dashboard:dash};(m[page]||home)()}
route();loadSettings().then(()=>{if(page=="home")route()});
</script></body></html>
